<!doctype html><html lang="zh-HK"><head><meta charset="utf-8"><title>SUMUWW documentation</title></head><body><p dir="auto">節點通常會建立 10 個對外連線，大部分用來轉發區塊和交易。節點可透過已驗證的備用連線轉發區塊，亦可暫時開啟第 11 個連線來尋找其他節點。連線總數上限為 125。連入連線最多 117 個，有 10 個對外連線時則最多 115 個。</p><p><a href="NETWORK_RUNBOOK.html">SUMUWW · 節點運作</a></p><a href="../en/DEPLOYMENT_READINESS.html">Open the English document</a></body></html>
