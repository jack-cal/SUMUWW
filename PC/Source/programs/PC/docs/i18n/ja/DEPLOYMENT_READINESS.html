<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>SUMUWW documentation</title></head><body><p dir="auto">通常は外向きの接続を10件開き、主にブロックと取引の中継に使います。検証済みの予備接続をブロックの中継に使うことも、別のノードを探すために一時的に11件目を開くこともあります。合計の上限は125件です。外部からの接続は最大117件、外向きが10件なら最大115件です。</p><p><a href="NETWORK_RUNBOOK.html">SUMUWW · ノードの運用</a></p><a href="../en/DEPLOYMENT_READINESS.html">Open the English document</a></body></html>
