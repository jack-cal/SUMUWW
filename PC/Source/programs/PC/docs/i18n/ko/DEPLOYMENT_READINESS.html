<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>SUMUWW documentation</title></head><body><p dir="auto">노드는 보통 발신 연결 10개를 맺고, 대부분의 연결로 블록과 거래를 중계합니다. 이미 검증한 연결을 블록 중계에 쓰거나 잠시 11번째 연결을 열어 다른 노드를 탐색할 수 있습니다. 전체 상한은 125개입니다. 수신 연결은 최대 117개이며, 발신이 10개면 최대 115개입니다.</p><p><a href="NETWORK_RUNBOOK.html">SUMUWW · 노드 운영</a></p><a href="../en/DEPLOYMENT_READINESS.html">Open the English document</a></body></html>
